name: Lado Organics quality checks

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: TypeScript, tests, lint and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check TypeScript
        run: npm run typecheck
      - name: Test Lado AI multilingual retrieval
        run: npm run test:lado-ai
      - name: Test roadmap safety contracts
        run: npm run test:roadmap
      - name: Test backend security contracts
        run: npm run test:backend-security
      - name: Test production readiness contracts
        run: npm run test:production-readiness
      - name: Test full roadmap contracts
        run: npm run test:full-roadmap
      - name: Run ESLint
        run: npm run lint
      - name: Build Next.js application
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  
  migration-tests:
    name: PostgreSQL migration integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lado_migration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lado_migration_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test database migrations and RLS
        run: npm run test:db-migrations
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lado_migration_test
