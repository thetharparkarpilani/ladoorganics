name: Lado Organics notification worker

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lado-notification-worker
  cancel-in-progress: false

jobs:
  process:
    name: Deliver queued order notifications
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Process notification outbox
        env:
          WORKER_BASE_URL: ${{ vars.LADO_NOTIFICATION_WORKER_URL }}
          CRON_SECRET: ${{ secrets.LADO_NOTIFICATION_CRON_SECRET }}
        run: |
          if [ -z "$WORKER_BASE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::notice::Set LADO_NOTIFICATION_WORKER_URL and LADO_NOTIFICATION_CRON_SECRET to activate the worker."
            exit 0
          fi
          case "$WORKER_BASE_URL" in
            https://*) ;;
            *) echo "::error::Worker base URL must use HTTPS."; exit 1 ;;
          esac
          curl --fail --silent --show-error --retry 2 --retry-delay 5 \
            --request POST "${WORKER_BASE_URL%/}/api/internal/notifications/process" \
            --header "Authorization: Bearer ${CRON_SECRET}" \
            --header "Accept: application/json"
