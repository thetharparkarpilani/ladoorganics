<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#244b35">
  <title>You're offline | Lado Organics</title>
  <style>
    :root{color-scheme:light;--green:#244b35;--ivory:#fbf7ef;--ink:#35271d;--muted:#74685d;--gold:#b38a45}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--ivory);color:var(--ink);font-family:Arial,sans-serif}
    main{width:min(100%,560px);padding:clamp(28px,6vw,52px);border:1px solid #e5dccd;border-radius:28px;background:#fffdf8;text-align:center;box-shadow:0 18px 60px #35271d12}
    img{width:76px;height:76px;object-fit:contain}p{color:var(--muted);line-height:1.7}h1{margin:20px 0 12px;color:var(--green);font-family:Georgia,serif;font-size:clamp(30px,7vw,44px)}
    a{display:inline-flex;margin-top:14px;padding:13px 22px;border-radius:999px;background:var(--green);color:white;text-decoration:none;font-weight:700}
    small{display:block;margin-top:24px;color:var(--gold);letter-spacing:.16em;font-weight:700}
  </style>
</head>
<body>
  <main>
    <img src="/lado-organics-logo.svg" alt="Lado Organics">
    <small>LADO ORGANICS · LADO LOVE PURE</small>
    <h1>You're currently offline</h1>
    <p>It looks like your internet connection is unavailable. Your account, orders and checkout are kept safely online and are not available in offline mode.</p>
    <p>Please reconnect and try again. We’ll be here when you’re back.</p>
    <a href="/">Try the homepage again</a>
  </main>
</body>
</html>
